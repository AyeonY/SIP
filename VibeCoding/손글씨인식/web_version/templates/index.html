<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>손글씨 숫자 인식 웹버전</title>
    <style>
        body { font-family: sans-serif; text-align: center; background: #f4f6f8; padding-top: 30px; }
        .container { background: white; width: 360px; margin: 0 auto; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        canvas { background: black; border-radius: 8px; cursor: crosshair; }
        .btn-group { margin-top: 15px; }
        button { padding: 10px 22px; font-size: 15px; margin: 0 5px; cursor: pointer; border: none; border-radius: 6px; font-weight: bold; }
        .btn-clear { background: #e74c3c; color: white; }
        .btn-recognize { background: #2ecc71; color: white; }
        #result { margin-top: 20px; font-size: 16px; font-weight: bold; color: #2c3e50; }
    </style>
</head>
<body>
    <div class="container">
        <h2>손글씨 숫자 인식</h2>
        <p>아래 캔버스에 0-9 숫자를 그려보세요</p>
        <canvas id="canvas" width="280" height="280"></canvas>
        <div class="btn-group">
            <button class="btn-clear" onclick="clearCanvas()">지우기</button>
            <button class="btn-recognize" onclick="recognize()">인식하기</button>
        </div>
        <div id="result">숫자를 그리고 '인식하기'를 클릭하세요</div>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        let drawing = false;

        ctx.fillStyle = "black";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.strokeStyle = "white";
        ctx.lineWidth = 18;
        ctx.lineCap = "round";

        canvas.addEventListener('mousedown', () => drawing = true);
        canvas.addEventListener('mouseup', () => { drawing = false; ctx.beginPath(); });
        canvas.addEventListener('mousemove', draw);

        function draw(e) {
            if (!drawing) return;
            const rect = canvas.getBoundingClientRect();
            ctx.lineTo(e.clientX - rect.left, e.clientY - rect.top);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(e.clientX - rect.left, e.clientY - rect.top);
        }

        function clearCanvas() {
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            document.getElementById('result').innerText = "숫자를 그리고 '인식하기'를 클릭하세요";
        }

        function recognize() {
            const dataURL = canvas.toDataURL('image/png');
            fetch('/predict', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ image: dataURL })
            })
            .then(res => res.json())
            .then(data => {
                document.getElementById('result').innerText = `인식 결과: ${data.prediction} (신뢰도: ${data.confidence}%)`;
            });
        }
    </script>
</body>
</html>
