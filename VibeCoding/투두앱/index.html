<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Tasks - 할 일 관리</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <!-- 헤더: 제목 + 다크 모드 토글 -->
    <header class="app-header">
      <h1>My Tasks <span class="badge" id="remainingBadge" title="남은 할 일">0</span></h1>
      <button class="theme-toggle" id="themeToggle" role="switch" aria-checked="false" aria-label="다크 모드">
        <span class="knob"></span>
      </button>
    </header>

    <!-- Step 3: 진행률 대시보드 -->
    <section class="dashboard">
      <div class="dash-top">
        <div>
          <div class="dash-label">전체 진행률</div>
          <div class="dash-value" id="totalProgressText">0/0 완료 (0%)</div>
        </div>
        <div class="today">
          <div class="dash-label">오늘 추가</div>
          <div class="today-count" id="todayCount">0개</div>
        </div>
      </div>
      <div class="progress"><span id="totalProgressBar"></span></div>

      <div class="mini-grid">
        <div class="mini-progress" data-cat="work" style="--cat:#4A90E2">
          <div class="mini-head"><span>업무</span><span class="mini-count">0/0</span></div>
          <div class="mini-bar"><span></span></div>
        </div>
        <div class="mini-progress" data-cat="personal" style="--cat:#27AE60">
          <div class="mini-head"><span>개인</span><span class="mini-count">0/0</span></div>
          <div class="mini-bar"><span></span></div>
        </div>
        <div class="mini-progress" data-cat="study" style="--cat:#8E44AD">
          <div class="mini-head"><span>공부</span><span class="mini-count">0/0</span></div>
          <div class="mini-bar"><span></span></div>
        </div>
      </div>

      <!-- Step 5: 오늘의 격언 -->
      <div class="quote">💬 <span id="quoteText"></span>
        <button class="icon-btn" id="quoteRefresh" title="다른 격언 보기">🔄</button>
      </div>
    </section>

    <!-- Step 1/2: 할 일 입력 -->
    <form class="todo-form" id="todoForm" autocomplete="off">
      <select id="categorySelect" aria-label="카테고리">
        <option value="work">업무</option>
        <option value="personal" selected>개인</option>
        <option value="study">공부</option>
      </select>
      <input type="text" id="todoInput" placeholder="새로운 할 일을 입력하세요... (Alt+N)" maxlength="100">
      <button type="submit" class="primary-btn">추가</button>
    </form>

    <!-- 5장: 자동 분류 도구 -->
    <div class="auto-tools">
      <span class="auto-label">🤖 스마트 분류</span>
      <button type="button" class="chip-btn" id="reclassifyBtn">🔄 자동 재분류</button>
      <button type="button" class="chip-btn" id="autoSettingsBtn">⚙️ 분류 설정</button>
    </div>

    <!-- Step 2: 카테고리 필터 -->
    <nav class="filters" aria-label="카테고리 필터">
      <button class="filter-btn active" data-filter="all" title="Alt+1">전체 <span class="count">0</span></button>
      <button class="filter-btn" data-filter="work" title="Alt+2" style="--cat:#4A90E2">업무 <span class="count">0</span></button>
      <button class="filter-btn" data-filter="personal" title="Alt+3" style="--cat:#27AE60">개인 <span class="count">0</span></button>
      <button class="filter-btn" data-filter="study" title="Alt+4" style="--cat:#8E44AD">공부 <span class="count">0</span></button>
    </nav>

    <!-- Step 4/5: 검색 + 정렬 -->
    <div class="toolbar">
      <div class="search">
        <input type="search" id="searchInput" placeholder="할 일 검색..." aria-label="할 일 검색">
        <span>🔍</span>
      </div>
      <label class="sort">정렬
        <select id="sortSelect">
          <option value="newest">최신순</option>
          <option value="oldest">오래된순</option>
          <option value="category">카테고리순</option>
          <option value="status">완료 상태순</option>
          <option value="manual">직접 정렬 (드래그)</option>
        </select>
      </label>
    </div>

    <div class="io-row">
      <button type="button" class="ghost-btn" id="exportBtn">⬇ 내보내기</button>
      <button type="button" class="ghost-btn" id="importBtn">⬆ 가져오기</button>
      <input type="file" id="importFile" accept=".json,application/json" hidden>
    </div>

    <!-- 할 일 목록 -->
    <ul class="todo-list" id="todoList"></ul>
    <div class="empty" id="emptyState" hidden>
      <div class="empty-icon">📝</div>
      <p>할 일이 없습니다. 추가해보세요!</p>
    </div>

    <footer class="app-footer">
      <button type="button" class="danger-btn" id="clearCompletedBtn">완료된 항목 삭제</button>
      <small class="muted">더블클릭: 수정 · Alt+N: 새 할 일 · Alt+1~4: 필터</small>
    </footer>
  </main>

  <!-- 확인 다이얼로그 -->
  <div class="modal" id="modal" aria-modal="true" role="dialog">
    <div class="modal-box">
      <h3 id="modalTitle"></h3>
      <div id="modalBody"></div>
      <div class="modal-actions">
        <button type="button" class="ghost-btn" id="modalCancel">취소</button>
        <button type="button" class="primary-btn" id="modalOk">확인</button>
      </div>
    </div>
  </div>
  <div class="toast" id="toast" role="status"></div>

  <script src="script.js"></script>
</body>
</html>
